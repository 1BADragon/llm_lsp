[package]
name = "llm_lsp"
version = "0.1.0"
edition = "2024"
description = "LLM-backed pair-programmer language server: passive code review and on-demand hover docs via the Claude Code CLI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/1BADragon/llm_lsp"
publish = false

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-lsp-server = "0.23.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tree-sitter = "0.27.2"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
