# Workspace config: only loaded after `:workspace-trust` in this folder.
#
# display-inlay-hints: Helix requests textDocument/inlayHint for the visible
#   range, a possible viewport signal.
# auto-document-highlight: may send textDocument/documentHighlight when the
#   cursor moves, a possible cursor signal.
# Turn them off for a second session to see what's left without them.
[editor.lsp]
display-inlay-hints = true
auto-document-highlight = true
