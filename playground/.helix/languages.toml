# Workspace-local Helix config: only applies when hx is run from this folder
# (run.sh does that). Paths are relative to this folder.
# `language-servers` replaces the list for each language, so the usual servers
# are kept in it.

# The debug build of this repo.
[language-server.llm-lsp]
command = "../target/debug/llm_lsp"
environment = { RUST_LOG = "llm_lsp=debug" }

[[language]]
name = "rust"
language-servers = ["rust-analyzer", "llm-lsp"]

[[language]]
name = "python"
language-servers = ["pyright", "ruff", "llm-lsp"]

[[language]]
name = "c"
language-servers = ["clangd", "llm-lsp"]

[[language]]
name = "cpp"
language-servers = ["clangd", "llm-lsp"]

[[language]]
name = "javascript"
language-servers = ["typescript-language-server", "llm-lsp"]

[[language]]
name = "jsx"
language-servers = ["typescript-language-server", "llm-lsp"]

[[language]]
name = "typescript"
language-servers = ["typescript-language-server", "llm-lsp"]

[[language]]
name = "tsx"
language-servers = ["typescript-language-server", "llm-lsp"]
